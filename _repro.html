<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>repro</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #0a0907; }
  .wrap2 { max-width: 560px; margin: 120px auto; }
</style>
</head>
<body>
<div class="wrap2">
  <div class="hero-form-wrap">
    <form class="hero-form" id="heroForm">
      <div class="form-row">
        <input type="email" id="eposta" name="eposta" placeholder="E-posta" autocomplete="email">
      </div>
      <div class="form-row">
        <div class="custom-select" id="islemDropdown">
          <button type="button" class="custom-select-btn" id="islemBtn">
            <span id="islemText" class="custom-select-placeholder">İlgilendiğiniz İşlem</span>
            <svg class="custom-select-chevron" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <ul class="custom-select-list" id="islemList" role="listbox">
            <li role="option">Meme Dikleştirme ve Büyütme</li>
            <li role="option">Popo Estetiği (BBL)</li>
            <li role="option">Liposuction (Yağ Aldırma)</li>
            <li role="option">Annelik Estetiği (Mommy Makeover)</li>
            <li role="option">Burun Estetiği (Rinoplasti)</li>
            <li role="option">Karın Germe</li>
            <li role="option">Diğer</li>
          </ul>
        </div>
      </div>
      <button type="submit" class="btn btn-cta form-submit"><span>Bilgi Talep Et</span><span class="arrow">→</span></button>
      <p class="form-note">Bilgileriniz KVKK kapsamında gizli tutulur.</p>
    </form>
  </div>
</div>
<script>
  document.getElementById('islemDropdown').classList.add('open');
  document.getElementById('islemList').removeAttribute('hidden');
</script>
</body>
</html>
